# handle undefined PYTHON in `noarch: generic` outputs
schema_version: 1

context:
  version: "30.12.0"
  PYTHON: $PYTHON

recipe:
  name: sqlglot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sqlglot/sqlglot-${{ version }}.tar.gz
  sha256: 6b8369704662d4f654bc934cea4dd31c916c2a571b389210cb9e951a275e5fd9

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: sqlglot
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools_scm
        - setuptools >=61.0
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - sqlglot
          pip_check: true
          python_version: ${{ python_min }}.*
      - files:
          source:
            - tests/
        requirements:
          run:
            - openjdk
            - pandas
            - pip
            - pyspark
            - pytest
            - python-dateutil
            - python-duckdb >=0.6
            - python ${{ python_min }}.*
        script:
          - pytest -vvv --capture=tee-sys --color=yes --tb=long tests

about:
  summary: An easily customizable SQL parser and transpiler
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tobymao/sqlglot

extra:
  recipe-maintainers:
    - tobymao
    - thewchan
